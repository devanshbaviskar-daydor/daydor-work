<!doctype html>
<html lang="en" data-theme="light">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8"><title>Input — preview</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.Daydor, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'dd-stack', style: { maxWidth: 420 } },
    h(D.Input, { label: 'Monthly CTC', prefix: '₹', defaultValue: '1,25,000', inputMode: 'numeric', hint: 'Before deductions. Daydor splits it into components.' }),
    h(D.Input, { label: 'PAN', defaultValue: 'ABCDE12345', error: 'PAN is 5 letters, 4 digits, then a letter — like ABCDE1234F.' })));
</script>
</body>
</html>
