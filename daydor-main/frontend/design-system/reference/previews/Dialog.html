<!doctype html>
<html lang="en" data-theme="light">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.Daydor, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { position: 'relative', height: 380 } },
    h(D.Dialog, { inline: true, title: 'File the October PF return?', onClose: function () {},
      description: 'Daydor will upload the ECR for 14 members to EPFO and generate the challan for ₹50,400.',
      irreversible: 'Once EPFO accepts it, this return can\u2019t be withdrawn — only corrected with a revised return.',
      footer: [h(D.Button, { key: 'c', variant: 'ghost' }, 'Not yet'), h(D.Button, { key: 'r', variant: 'primary', icon: 'lock' }, 'File with EPFO')] })));
</script>
</body>
</html>
