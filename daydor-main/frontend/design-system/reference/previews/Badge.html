<!doctype html>
<html lang="en" data-theme="light">
<head>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.Daydor, h = React.createElement;
  var row = function (keys) { return h('div', { className: 'dd-row', style: { paddingBottom: 0 } }, keys.map(function (k) { return h(D.Badge, { key: k, status: k }); })); };
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    row(['needs-you', 'running', 'done', 'failed']), row(['pending', 'approved', 'rejected', 'withdrawn']), row(['draft', 'processing', 'paid', 'overdue', 'filed'])));
</script>
</body>
</html>
