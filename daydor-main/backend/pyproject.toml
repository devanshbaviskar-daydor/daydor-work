[project]
name = "daydor"
version = "0.1.0"
description = "Managed HR/payroll/compliance service for Indian companies of roughly 8-25 employees."
requires-python = ">=3.12"
dependencies = [
    "temporalio==1.34.0",
    "langgraph==1.2.12",
    "langchain-core==1.6.6",
    "psycopg[binary,pool]==3.3.6",
    "mcp==2.3.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.25.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
